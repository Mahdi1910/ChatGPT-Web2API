name: Apply branch_conversation implementation

on:
  push:
    branches: [feature/branch-conversation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message || '', '[branch-tool-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/branch-conversation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply implementation patch
        run: python .github/branch_patch_runner.py

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Ruff
        run: ruff check src/ tests/

      - name: Focused branch tests
        run: pytest -v tests/test_branch_conversation.py tests/test_unit.py tests/test_deep.py tests/test_gating.py tests/test_integration.py

      - name: Full non-E2E suite
        run: pytest -v -m 'not e2e'

      - name: Commit verified implementation to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ tests/ README.md CHANGELOG.md docs/api-reference.md .env.example
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 1
          fi
          git commit -m 'feat(mcp): add branch_conversation tool [branch-tool-applied]'
          git push origin HEAD:feature/branch-conversation
